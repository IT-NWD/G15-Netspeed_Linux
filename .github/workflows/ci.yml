name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  core-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v7

      - name: Core-Tests mit strengen Warnungen bauen
        run: >-
          make test-core
          CFLAGS='-Wall -Wextra -Wpedantic -Werror -O2'

      - name: Verbotene GPU-Aufrufe ausschließen
        run: >-
          ! grep -R -E -i
          'nvidia-smi|popen[[:space:]]*\(|pclose[[:space:]]*\(|nvml'
          src include
